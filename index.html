<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#16051f">
  <title>For Kitty ❤️ — From Ayush</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html {
      scroll-behavior: smooth
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      background: #100316;
      color: #fff;
      overflow-x: hidden;
    }

    button {
      font: inherit
    }

    .screen {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 20px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 71, 157, .18), transparent 28%),
        radial-gradient(circle at 80% 75%, rgba(152, 63, 255, .20), transparent 32%),
        linear-gradient(145deg, #100316, #26092f 55%, #12051b);
    }

    .hidden {
      display: none !important
    }

    .glow {
      position: absolute;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: #ff3f9d;
      filter: blur(100px);
      opacity: .12;
      pointer-events: none
    }

    .g1 {
      top: -100px;
      left: -100px
    }

    .g2 {
      bottom: -120px;
      right: -90px;
      background: #9b5cff
    }

    .stars,
    .hearts {
      position: absolute;
      inset: 0;
      pointer-events: none
    }

    .star {
      position: absolute;
      width: 3px;
      height: 3px;
      background: #fff;
      border-radius: 50%;
      opacity: .5;
      animation: twinkle 2s infinite alternate
    }

    @keyframes twinkle {
      to {
        opacity: .08;
        transform: scale(.4)
      }
    }

    .card {
      width: min(470px, 100%);
      text-align: center;
      position: relative;
      z-index: 2;
      padding: 34px 24px;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 30px;
      background: rgba(255, 255, 255, .055);
      backdrop-filter: blur(14px);
      box-shadow: 0 20px 70px rgba(0, 0, 0, .35)
    }

    .kicker {
      font: 700 12px Arial, sans-serif;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #ff9bca;
      margin-bottom: 15px
    }

    h1 {
      font-size: clamp(34px, 9vw, 56px);
      line-height: 1.03;
      margin-bottom: 14px
    }

    h2 {
      font-size: clamp(28px, 7vw, 42px);
      line-height: 1.08;
      margin-bottom: 16px
    }

    p {
      font-family: Arial, sans-serif;
      line-height: 1.65;
      color: #f7eaf5;
      font-size: 15px
    }

    .script {
      font-style: italic
    }

    .btn {
      border: 0;
      border-radius: 999px;
      padding: 14px 24px;
      margin: 10px 5px;
      cursor: pointer;
      font-weight: 700;
      font-family: Arial, sans-serif;
      transition: .25s transform, .25s box-shadow;
    }

    .btn:hover {
      transform: translateY(-2px)
    }

    .yes {
      background: linear-gradient(135deg, #ff4d9d, #ff77b7);
      color: #fff;
      box-shadow: 0 10px 30px rgba(255, 77, 157, .28)
    }

    .no {
      background: rgba(255, 255, 255, .09);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, .15)
    }

    .next {
      background: #fff;
      color: #26092f
    }

    .heart {
      font-size: 58px;
      display: block;
      margin-bottom: 14px;
      animation: pulse 1.4s infinite
    }

    @keyframes pulse {
      50% {
        transform: scale(1.13)
      }
    }

    .small {
      font-size: 12px;
      color: #d7bfd5;
      margin-top: 12px
    }

    .fade {
      animation: fade .8s ease both
    }

    @keyframes fade {
      from {
        opacity: 0;
        transform: translateY(15px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin: 22px 0
    }

    .photo {
      aspect-ratio: 1/1;
      border-radius: 18px;
      overflow: hidden;
      background: linear-gradient(135deg, #432044, #1d0a28);
      border: 1px solid rgba(255, 255, 255, .12);
      position: relative
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block
    }

    .photo span {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #d8bdd5;
      font: 12px Arial, sans-serif;
      padding: 10px
    }

    .letter {
      text-align: left;
      background: rgba(255, 255, 255, .065);
      border-radius: 22px;
      padding: 22px;
      border: 1px solid rgba(255, 255, 255, .12);
      max-height: 58svh;
      overflow: auto;
      box-shadow: inset 0 1px rgba(255, 255, 255, .06)
    }

    .letter p {
      font-family: Georgia, serif;
      font-size: 16px;
      line-height: 1.8;
      color: #fff;
      margin-bottom: 14px
    }

    .divider {
      width: 70px;
      height: 2px;
      background: #ff6eac;
      margin: 17px auto;
      border-radius: 2px
    }

    .envelope {
      font-size: 72px;
      filter: drop-shadow(0 12px 20px rgba(255, 80, 170, .25));
      animation: float 2.5s ease-in-out infinite
    }

    @keyframes float {
      50% {
        transform: translateY(-9px) rotate(2deg)
      }
    }

    .final-heart {
      font-size: 80px;
      animation: pulse 1.1s infinite
    }

    #celebrate {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 99
    }

    .confetti {
      position: absolute;
      top: -15px;
      width: 8px;
      height: 14px;
      animation: fall linear forwards
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0
      }
    }

    .float-heart {
      position: absolute;
      bottom: -30px;
      font-size: 20px;
      animation: rise 5s linear forwards;
      opacity: .8
    }

    @keyframes rise {
      to {
        transform: translateY(-110vh) translateX(var(--x));
        opacity: 0
      }
    }

    #musicNote {
      position: fixed;
      right: 14px;
      bottom: 14px;
      z-index: 20;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, .2);
      background: rgba(20, 4, 27, .8);
      color: #fff
    }

    @media(max-width:380px) {
      .card {
        padding: 27px 17px
      }

      .letter {
        padding: 17px
      }

      .letter p {
        font-size: 15px
      }
    }

    /* 💌 NEW LOVE LETTER PAGE */
    .letter-card {
      text-align: left;
      background: linear-gradient(145deg,
          rgba(255, 255, 255, .11),
          rgba(255, 255, 255, .045));
      border: 1px solid rgba(255, 182, 220, .25);
      border-radius: 24px;
      padding: 22px 20px;
      max-height: 58svh;
      overflow-y: auto;
      box-shadow:
        inset 0 1px rgba(255, 255, 255, .08),
        0 15px 40px rgba(0, 0, 0, .18);
    }

    .letter-title {
      text-align: center;
      font-family: Georgia, serif;
      font-size: 24px;
      color: #ffd6e9;
      margin-bottom: 18px;
    }

    .letter-card p {
      font-family: Georgia, serif;
      font-size: 15.5px;
      line-height: 1.75;
      color: #fff;
      margin-bottom: 14px;
    }

    .signature {
      text-align: right;
      font-family: Georgia, serif;
      font-style: italic;
      color: #ffb6d7;
      font-size: 18px;
      margin-top: 18px;
    }

    /* ♾️ FOREVER COUNTER */
    .forever-timer {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin: 24px 0 15px;
    }

    .time-box {
      padding: 15px 8px;
      border-radius: 18px;
      background: rgba(255, 255, 255, .075);
      border: 1px solid rgba(255, 255, 255, .12);
    }

    .time-box strong {
      display: block;
      font: 700 27px Arial, sans-serif;
      color: #fff;
    }

    .time-box span {
      display: block;
      margin-top: 5px;
      font: 11px Arial, sans-serif;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ffacd1;
    }

    .forever-note {
      font-family: Georgia, serif;
      font-style: italic;
      color: #f8dcea;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <div id="celebrate"></div>
  <div class="screen" id="app">
    <div class="glow g1"></div>
    <div class="glow g2"></div>
    <div class="stars" id="stars"></div>
    <div class="card fade" id="card"></div>
  </div>

  <!-- Optional music: put your mp3 at music.mp3 and change MUSIC_ENABLED to true below -->
  <audio id="music" loop preload="auto">
    <source src="music.mp3" type="audio/mpeg">
  </audio>
  <button id="musicNote" title="Music">♪</button>

  <script>
    const MUSIC_ENABLED = false;
    const music = document.getElementById('music');
    const card = document.getElementById('card');
    let step = 0;

    const loveLetter = `
<p>I just wanna make you the happiest you've ever been. 🥹❤️ I want to make you feel safe, loved, and comforted. 🫂💗 I want you to know that you can come to me when you're not okay, when your eyes are filled with tears, and I'll hold you till you're a little more okay. 🤍🫂 I'll always be here for you. ❤️</p>
<p>I love you at your best and at your worst. 🥺❤️ Nothing's gonna change that. ♾️💞 Ours is one of those love stories people will talk about for years to come, because we have something extraordinary, something real. 🫶✨ You are not just my world, you're my everything. 🌎❤️</p>
<p>I'm here, and I'm gonna keep being here every day for the rest of our lives. 🥹❤️ I'm not leaving, I'm not going anywhere. I'm staying right here with you. 🫂💗 I wouldn't dream of being anywhere else. You truly are my home, my safe place, the love of my life. 🏡❤️‍🩹✨</p>
<p>I want you to know that I sure as hell mean it when I say I'd do anything for you. ❤️‍🔥 I'd do absolutely anything. 🫶🥺 I love you now, and I love you always. ♾️❤️</p>
<p>Everything is going to be okay. 🤍 Everything. We are going to be okay. 🫂❤️ This will last as long as we choose each other and keep choosing each other for the rest of our lives. 💍❤️ And I have no doubt in my mind that we will. 🥹♾️</p>
<p>I love you. ❤️ Really… with everything I have in me. 🫀🥺❤️ I love you. Forever. ♾️❤️‍🩹</p>
`;

    function stars() {
      for (let i = 0; i < 45; i++) {
        const s = document.createElement('i'); s.className = 'star';
        s.style.left = Math.random() * 100 + '%'; s.style.top = Math.random() * 100 + '%';
        s.style.animationDelay = Math.random() * 2 + 's'; s.style.opacity = .15 + Math.random() * .6;
        document.getElementById('stars').appendChild(s);
      }
    }
    function startMusic() {
      if (MUSIC_ENABLED) music.play().catch(() => { });
    }
    function go(n) {
      step = n; card.classList.remove('fade'); void card.offsetWidth; card.classList.add('fade'); render();
    }
    function render() {
      const screens = [

        /* PAGE 0 */
        `<span class="heart">💗</span>
   <div class="kicker">A little something for you</div>
   <h1>Hey Kitty…</h1>
   <p>There’s something I’ve been wanting to tell you.</p>
   <div class="divider"></div>
   <button class="btn yes" onclick="go(1);startMusic()">
      Open it ❤️
   </button>`,

        /* PAGE 1 */
        `<div class="kicker">17 March</div>
   <h2>Do you remember<br>the day we first met?</h2>
   <span class="heart">🥹</span>
   <p>For me, that day became one of the most special dates of my life.</p>
   <button class="btn next" onclick="go(2)">
      I remember… ✨
   </button>`,

        /* PAGE 2 */
        `<div class="kicker">Be honest with me</div>
   <h2>Kitty…<br>do you love me too?</h2>
   <span class="heart">🫶</span>

   <button class="btn yes" onclick="go(3)">
      Yes, Baby ❤️
   </button>

   <button class="btn no" onclick="tease()">
      Hmm… 😶
   </button>

   <p class="small" id="tease"></p>`,

        /* PAGE 3 */
        `<div class="kicker">One more question</div>
   <h2>Will you be<br>mine forever?</h2>

   <span class="heart">💍</span>

   <p>
      I don't want a perfect story.
      I just want our story — together.
   </p>

   <button class="btn yes" onclick="go(4);celebrate()">
      YES, ALWAYS ❤️
   </button>`,

        /* PAGE 4 — PHOTOS */
        `<div class="kicker">Our little memories</div>

   <h2>Just you & me 📸</h2>

   <div class="photo-grid">

      ${[1, 2, 3, 4].map(i => `
        <div class="photo">
          <img
            src="photos/photo${i}.jpg"
            alt="Our memory"
            onerror="this.style.display='none'"
          >
        </div>
      `).join('')}

   </div>

   <button class="btn next" onclick="go(5)">
      There’s more… 💌
   </button>`,

        /* PAGE 5 */
        `<span class="envelope">💌</span>

   <div class="kicker">
      A Letter From My Heart
   </div>

   <h2>For You ❤️</h2>

   <p>
      Read this slowly.
      Every word is from my heart.
   </p>

   <button class="btn yes" onclick="go(6)">
      Open my heart ❤️
   </button>`,

        /* PAGE 6 — NEW LOVE LETTER PAGE */
        `<div class="kicker">
      My love letter
   </div>

   <h2>
      To my Kitty ❤️
   </h2>

   <div class="letter-card">

      <div class="letter-title">
         💌 A Letter From Ayush
      </div>

      ${loveLetter}

      <div class="signature">
         Forever yours,<br>
         <b>Ayush ❤️</b>
      </div>

   </div>

   <button class="btn next" onclick="go(7)">
      One last thing… 🥺
   </button>`,

        /* PAGE 7 */
        `<span class="final-heart">❤️</span>

   <div class="kicker">
      Just for you
   </div>

   <h2>
      Kitty, you are my home.
   </h2>

   <p>
      I love you so much,
      I love you always,
      and I want to keep choosing you —
      every single second. ♾️
   </p>

   <div class="divider"></div>

   <p class="script">
      “Somehow, in all the chaos of this world, I found you.”
   </p>

   <button class="btn yes" onclick="go(8);celebrate()">
      More from my heart ❤️
   </button>`,

        /* PAGE 8 — SPECIAL LETTER */

        `<span class="envelope">💌</span>

<div class="kicker">
   One last letter
</div>

<h2>
   Before our forever begins ❤️
</h2>

<div class="letter-card">

   <div class="letter-title">
      💌 For My Kitty
   </div>

   <p>
      jo tu aa vanche che to, hu just keva mangu chu k tu mara mate ketli khas che. ❤️
   </p>

   <p>
      tu mari life aai tyarthi just bs mane new life mali che. tari smile, tari vaato,
      tari presence, tari nani nani vaato mari happiness mate javabdar che. 🥹❤️
   </p>

   <p>
      idk aapdu future kevu hse but ek vastu mane kbr che tu mare sathe hse, tu mari life ma hse, tu mari life no part hse, and tu mari life ma hamesha hse.
      🫂💗
   </p>

   <p>
      tu mari life no ae bhag che je tane kbr nathi. mari every second no mood tara pr j depend che.
      beautiful moments, that silly fights waiting for us... i want to choose you again and again and again. ♾️
   </p>

   <p>
      to tane jyare pn tane doubt hoy k koi tane pyar nai krty to aa mara nankda page pr aavje ne joje.
      and yaad kr j k aa duniya ma kyay ayush che je aeni kitty ne khub j khub jjjjj pyar kre che. 🫀❤️
   </p>

   <p>
      tu jyare bhi potana pr self doubt kre tu je bhi keh e ke tu red flag che etc.. bs tu mari sath
      rehje tara badha doubt hu clear kris. tare mate hu hamesha ubho chu and haa khali keto nathi karine pn batais.🥹💞
   </p>

   <p>
      and tu bs hamesha khu ree yrr, hasti j sari lage che tu. past ne yaad naa kr overthinking naa kris, kai bhi
      aavu hoy to mane keh hu chu ne tara jode km chinta kre che gandi.. ❤️
   </p>

   <p>
      ane aa aapdi story ni starting j che... and aa bs khali ek nankdo tukdo hato mara heart mathi baki
      aakhu heart explore kris tu etle kbr pdse tane k tara mate koi che aa duniy ma je tane khub j chahe che. ✨
   </p>

   <p>
      mare aa vaat tane kyarni kehvi ti but aaje hu radhashtmi na divse mari radha ne kehva mangis k..
  </p>

   <p>
      I love you soo much, and i will always love youu. 🫂💗
   </p>

   <p>
     su hve hu kahi saku k aapdo dating era and thaine relationship start thay che, jo k hu to ej manto hato bczz i justt love you so muchhh yrrrrrrrrr....... 💗
   </p>

   <p>
      bs hve hu tara reply ni raah joi rahyo chu.
   </p>

   <div class="signature">
      Always yours,<br>
      <b>Ayush ❤️</b>
   </div>

</div>

<button class="btn next" onclick="go(9)">
   Now… let's begin forever ♾️
</button>`,

        /* PAGE 9 */
        `<span class="final-heart">💞</span>

   <div class="kicker">
      Forever starts here
   </div>

   <h1>
      I love you, Kitty.
   </h1>

   <p class="script">
      From Ayush, with all my heart. 🫀❤️
   </p>

   <div class="divider"></div>

   <p>
      19 Sep (Radhashtmi) ♾️
   </p>

   <button
      class="btn yes"
      onclick="go(10);startForever()"
   >
      Start our forever ❤️
   </button>`,

        /* PAGE 10 — FOREVER COUNTER */
        `<span class="final-heart">♾️</span>

   <div class="kicker">
      OUR FOREVER
   </div>

   <h2>
      Our forever started. ❤️
   </h2>

   <p>
      And every second from this moment
      belongs to us.
   </p>

   <div class="forever-timer">

      <div class="time-box">
         <strong id="years">0</strong>
         <span>Years</span>
      </div>

      <div class="time-box">
         <strong id="days">0</strong>
         <span>Days</span>
      </div>

      <div class="time-box">
         <strong id="hours">0</strong>
         <span>Hours</span>
      </div>

      <div class="time-box">
         <strong id="minutes">0</strong>
         <span>Minutes</span>
      </div>

      <div class="time-box">
         <strong id="seconds">0</strong>
         <span>Seconds</span>
      </div>

   </div>

   <p class="forever-note">
      “I choose you today, tomorrow,
      and every day after.” 🫂❤️
   </p>`
      ];
      card.innerHTML = screens[step];
    }
    function tease() {
      const t = document.getElementById('tease');
      if (t) t.textContent = 'Nice try, Kitty 😌❤️ You know there is only one answer.';
    }
    function celebrate() {
      const c = document.getElementById('celebrate');
      for (let i = 0; i < 85; i++) {
        const x = document.createElement('span'); x.className = 'confetti';
        x.style.left = Math.random() * 100 + 'vw';
        x.style.animationDuration = (2 + Math.random() * 3) + 's';
        x.style.animationDelay = Math.random() * .4 + 's';
        x.style.transform = `rotate(${Math.random() * 360}deg)`;
        x.style.background = ['#ff4d9d', '#ffd1e6', '#fff', '#c18cff'][i % 4];
        c.appendChild(x); setTimeout(() => x.remove(), 5500);
      }
      for (let i = 0; i < 15; i++) {
        const h = document.createElement('span'); h.className = 'float-heart'; h.textContent = ['❤️', '💗', '💖', '💕'][i % 4];
        h.style.left = Math.random() * 100 + 'vw'; h.style.setProperty('--x', (Math.random() * 120 - 60) + 'px');
        h.style.animationDelay = Math.random() * 1.5 + 's'; c.appendChild(h); setTimeout(() => h.remove(), 6500);
      }
    }
    /* ♾️ OUR FOREVER TIMER */

    let foreverStart = null;
    let foreverInterval = null;

    function startForever() {

      // Start counting from the exact moment
      // she clicks "Start our forever"
      foreverStart = Date.now();

      updateForever();

      clearInterval(foreverInterval);

      foreverInterval = setInterval(
        updateForever,
        1000
      );
    }


    function updateForever() {

      if (!foreverStart) return;

      let totalSeconds =
        Math.floor(
          (Date.now() - foreverStart) / 1000
        );

      const seconds =
        totalSeconds % 60;

      totalSeconds =
        Math.floor(totalSeconds / 60);

      const minutes =
        totalSeconds % 60;

      totalSeconds =
        Math.floor(totalSeconds / 60);

      const hours =
        totalSeconds % 24;

      const totalDays =
        Math.floor(totalSeconds / 24);

      const years =
        Math.floor(totalDays / 365);

      const days =
        totalDays % 365;


      const setValue = (id, value) => {

        const element =
          document.getElementById(id);

        if (element) {
          element.textContent = value;
        }

      };


      setValue("years", years);
      setValue("days", days);
      setValue("hours", hours);
      setValue("minutes", minutes);
      setValue("seconds", seconds);
    }

    document.getElementById('musicNote').onclick = () => {
      if (music.paused) { music.play().catch(() => { }); document.getElementById('musicNote').textContent = '❚❚' }
      else { music.pause(); document.getElementById('musicNote').textContent = '♪' }
    };
    stars(); render();
  </script>
</body>

</html>
